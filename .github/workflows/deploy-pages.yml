name: Deploy Center City Wireless to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'center-city-wireless/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: center-city-wireless
          destination_dir: ./
          keep_files: false
```
